<style>
:root {

}

* { box-sizing: border-box; }
html, body { margin: 0; }
html { -webkit-text-size-adjust: 100%; }
body { background: var(--bg); color: var(--text); font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
.banner { background: var(--danger); color: #fff; padding: calc(10px + env(safe-area-inset-top)) 16px 10px; font-weight: 700; text-align: center; font-size: 14px; letter-spacing: .02em; }

:root[data-theme="dark"] .banner { background: #8e1b12; }

.crit { font-size: 16px; }
.crit.falta { color: var(--muted); font-style: italic; }
.pob { color: var(--muted); font-size: 13px; margin-top: 4px; }
.item.d-Validada { border-left: 4px solid var(--igual); }
.item.d-Corregir { border-left: 4px solid var(--difiere); }
.item.d-Descartar { border-left: 4px solid var(--muted); opacity: .7; }
.guardia .item.d-Descartar { display: none; }
.decide { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }

.decide button[aria-pressed="true"].v { background: var(--igual); border-color: var(--igual); color: var(--card); }
.decide button[aria-pressed="true"].c { background: var(--difiere); border-color: var(--difiere); color: var(--card); }
.decide button[aria-pressed="true"].x { background: var(--muted); border-color: var(--muted); color: var(--card); }
textarea { margin-top: 8px; min-height: 70px; font-size: 15px; }
.changed { color: var(--danger); font-size: 13px; font-weight: 600; margin-top: 6px; }
details { margin-top: 8px; }
summary { cursor: pointer; color: var(--accent); font-size: 14px; padding: 4px 0; min-height: 30px; }
dl { margin: 4px 0 0; font-size: 14px; }
dt { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; margin-top: 8px; }
dd { margin: 2px 0 0; overflow-wrap: anywhere; }
dd a { color: var(--accent); }
q { font-style: italic; }
.guardia .review { display: none; }
.tools { display: flex; gap: 8px; flex-wrap: wrap; margin: 4px 0 14px; }
.tools button { border: 1px solid var(--line); background: var(--card); border-radius: 10px; padding: 8px 12px; min-height: 42px; cursor: pointer; font-size: 14px; }
.tools .primary { background: var(--accent); border-color: var(--accent); color: var(--card); }
.note { background: var(--accent-soft); border-radius: 10px; padding: 10px 12px; font-size: 14px; margin-bottom: 12px; }
.empty-state { text-align: center; color: var(--muted); padding: 40px 10px; }
.hit { font-size: 13px; color: var(--muted); margin-top: 4px; }
footer { color: var(--muted); font-size: 13px; text-align: center; padding: 0 16px calc(30px + env(safe-area-inset-bottom)); }
</style>
</head>

const FICHAS = [...new Set(DATA.map(r => r.ficha))];
const KEY = "fg-decisiones";
const $ = id => document.getElementById(id);
const norm = s => (s||"").toString().normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
DATA.forEach(r => { r._hay = norm([r.ficha, r.poblacion, r.criterio, r.nota].join(" ")); });

let view = null;     // ficha abierta, o null para la lista
let mode = "rev";
let dec = {};
try { dec = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(dec)); } catch (e) {} };
// Una decisión vale solo si el texto del criterio no cambió desde que la tomaste.
const decisionOf = r => dec[r.id] && dec[r.id].t === r.criterio ? dec[r.id] : null;
const changedSince = r => dec[r.id] && dec[r.id].t !== r.criterio;
const compClass = c => c === "Una sola fuente" ? "c-una" : "c-" + c;

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}

function field(dl, label, value, href) {
  if (!value || value === "—") return;
  dl.append(el("dt", null, label));
  const dd = el("dd");
  if (href) { const a = el("a", null, value); a.href = value; a.target = "_blank"; a.rel = "noopener"; dd.append(a); }
  else dd.textContent = value;
  dl.append(dd);
}

function item(r, showFicha) {
  const d = decisionOf(r);
  const box = el("article", "card item" + (d ? " d-" + d.d : ""));
  if (showFicha) box.append(el("div", "hit", r.ficha + " · " + PART_LABEL[r.parte]));
  box.append(el("div", "crit" + (r.comparacion === "FALTANTE" ? " falta" : ""), (r.comparacion === "FALTANTE" ? "FALTA: " : "") + r.criterio));
  box.append(el("div", "pob", r.poblacion));
  const badges = el("div", "badges review");
  badges.append(el("span", "badge " + compClass(r.comparacion), r.comparacion));
  if (!d) badges.append(el("span", "badge c-FALTANTE", "Sin validar"));
  box.append(badges);

  const det = el("details", "review");
  det.append(el("summary", null, "Fuentes y nota"));
  const dl = el("dl");
  if (r.o_cita !== "—") field(dl, `Tu original 2025 · pág. ${r.o_pag}`, "«" + r.o_cita + "»");
  if (r.m_cita !== "—") field(dl, `Manual 2026 · pág. ${r.m_pag}`, "«" + r.m_cita + "»");
  if (r.guia !== "—") { field(dl, `${r.guia} · ${r.seccion}`, "«" + r.g_cita + "»"); field(dl, "Enlace", r.enlace, true); }
  field(dl, "Nota de Claude", r.nota);
  field(dl, "Fila en la planilla", `Lote ${r.lote}, Nº ${r.n}`);
  det.append(dl); box.append(det);

  const rv = el("div", "review");
  if (changedSince(r)) rv.append(el("div", "changed", "El texto cambió desde tu última decisión: volvé a revisarlo."));
  const btns = el("div", "decide");
  for (const [lab, cls] of [["Validada", "v"], ["Corregir", "c"], ["Descartar", "x"]]) {
    const b = el("button", cls, lab); b.type = "button";
    b.setAttribute("aria-pressed", String(!!d && d.d === lab));
    b.onclick = () => {
      if (d && d.d === lab) delete dec[r.id];
      else dec[r.id] = {d: lab, c: (d && d.c) || "", t: r.criterio};
      save(); render();
    };
    btns.append(b);
  }
  rv.append(btns);
  if (d && d.d !== "Validada") {
    const ta = el("textarea"); ta.placeholder = d.d === "Corregir" ? "¿Cómo debería decir?" : "¿Por qué la descartás? (opcional)";
    ta.value = d.c || "";
    ta.oninput = () => { dec[r.id].c = ta.value; save(); };
    rv.append(ta);
  }
  box.append(rv);
  return box;
}

function stats(rows) {
  const done = rows.filter(decisionOf).length;
  const amar = rows.filter(r => r.comparacion === "Difieren" && !decisionOf(r)).length;
  return {done, total: rows.length, amar};
}

function listView() {
  const main = $("main"); main.textContent = "";
  const all = stats(DATA);
  $("meta").textContent = `${FICHAS.length} situaciones · ${all.done} de ${all.total} criterios revisados`;
  if (mode === "rev") {
    main.append(el("div", "note", "Tocá una situación para verla como en la guardia. En cada criterio marcá Validada, Corregir o Descartar. Lo amarillo (Difieren) es lo que más pesa. Cuando quieras, exportá tus decisiones y pasame el archivo."));
    const tools = el("div", "tools");
    const ex = el("button", "primary", "Exportar mis decisiones"); ex.type = "button"; ex.onclick = exportCsv;
    const only = el("button", null, "Ver solo amarillas pendientes"); only.type = "button";
    only.onclick = () => { $("q").value = ""; view = "__amarillas"; render(); };
    tools.append(ex, only); main.append(tools);
  }
  for (const f of FICHAS) {
    const rows = DATA.filter(r => r.ficha === f);
    const s = stats(rows);
    const b = el("button", "card fcard"); b.type = "button";
    b.append(el("h3", null, f));
    b.append(el("div", "sub", `${rows.length} criterios · lote ${rows[0].lote}` + (mode === "rev" ? ` · ${s.done} revisados` + (s.amar ? ` · ${s.amar} amarillas pendientes` : "") : "")));
    if (mode === "rev") { const bar = el("div", "bar"); const sp = el("span"); sp.style.width = (100 * s.done / s.total) + "%"; bar.append(sp); b.append(bar); }
    b.onclick = () => { view = f; window.scrollTo(0, 0); render(); };
    main.append(b);
  }
}

function fichaView(rows, title) {
  const main = $("main"); main.textContent = "";
  $("title").textContent = title;
  const s = stats(rows);
  $("meta").textContent = mode === "rev" ? `${s.done} de ${s.total} revisados` : "Vista de guardia: solo los criterios, sin fuentes";
  for (const p of PARTS) {
    const sec = rows.filter(r => r.parte === p);
    if (!sec.length) continue;
    main.append(el("h2", null, PART_LABEL[p]));
    sec.forEach(r => main.append(item(r, view === "__amarillas")));
  }
  if (!rows.length) main.append(el("div", "empty-state", "No quedan amarillas pendientes."));
}

function searchView(q) {
  const main = $("main"); main.textContent = "";
  const terms = norm(q).split(/\s+/).filter(Boolean);
  const hits = DATA.filter(r => terms.every(t => r._hay.includes(t)));
  $("meta").textContent = `${hits.length} criterios encontrados`;
  if (!hits.length) { main.append(el("div", "empty-state", "No está en las fichas.")); return; }
  hits.forEach(r => main.append(item(r, true)));
}

function render() {
  document.body.classList.toggle("guardia", mode === "gua");
  $("m-rev").setAttribute("aria-pressed", String(mode === "rev"));
  $("m-gua").setAttribute("aria-pressed", String(mode === "gua"));
  const q = $("q").value.trim();
  $("back").hidden = !view && !q;
  $("title").textContent = "Fichas de Guardia";
  if (q) return searchView(q);
  if (view === "__amarillas") return fichaView(DATA.filter(r => r.comparacion === "Difieren" && !decisionOf(r)), "Amarillas pendientes");
  if (view) return fichaView(DATA.filter(r => r.ficha === view), view);
  listView();
}

function exportCsv() {
  const esc = v => '"' + String(v ?? "").replace(/"/g, '""') + '"';
  const lines = [["lote", "n", "ficha", "parte", "criterio", "decision", "comentario", "texto_cambio"].map(esc).join(",")];
  for (const r of DATA) {
    if (!dec[r.id]) continue;
    lines.push([r.lote, r.n, r.ficha, PART_LABEL[r.parte], r.criterio, dec[r.id].d, dec[r.id].c, changedSince(r) ? "si" : "no"].map(esc).join(","));
  }
  const blob = new Blob(["﻿" + lines.join("\r\n")], {type: "text/csv;charset=utf-8"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "decisiones_fichas_" + new Date().toISOString().slice(0, 10) + ".csv";
  document.body.append(a); a.click(); a.remove();
}

function theme() {
  let t = null;
  try { t = localStorage.getItem("dg-theme"); } catch (e) {}
  if (t) document.documentElement.dataset.theme = t;
  $("theme").onclick = () => {
    const cur = document.documentElement.dataset.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    const next = cur === "dark" ? "light" : "dark";
    document.documentElement.dataset.theme = next;
    try { localStorage.setItem("dg-theme", next); } catch (e) {}
  };
}

theme();
$("m-rev").onclick = () => { mode = "rev"; render(); };
$("m-gua").onclick = () => { mode = "gua"; render(); };
$("back").onclick = () => { $("q").value = ""; view = null; window.scrollTo(0, 0); render(); };
$("q").addEventListener("input", render);
render();
</script>
<script>if ("serviceWorker" in navigator && location.protocol.startsWith("http")) { navigator.serviceWorker.register("sw.js").catch(() => {}); }</script>
</body>
</html>
